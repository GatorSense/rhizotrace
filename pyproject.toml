[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhizotrace"
version = "0.1.0"
description = "2D root phenotyping from minirhizotron images: per-root traits and branching"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Ritesh Chowdhry", email = "riteshchoudhery313@gmail.com" }]
keywords = ["root phenotyping", "minirhizotron", "plant phenomics", "image analysis", "root segmentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "Pillow>=9.0",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/GatorSense/rhizotrace"
Source = "https://github.com/GatorSense/rhizotrace"
Issues = "https://github.com/GatorSense/rhizotrace/issues"

[project.scripts]
rhizotrace = "rhizotrace.cli:main"

[project.optional-dependencies]
segmentation = ["torch>=2.0"]

[dependency-groups]
dev = ["pytest>=7", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rhizotrace = ["samples/*/*.png", "samples/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
